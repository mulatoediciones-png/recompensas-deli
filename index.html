<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recompensas Deli Snacks</title>
<meta name="description" content="App de recompensas para promotoras de Deli Snacks">
<meta name="theme-color" content="#E94C1D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recompensas">
<style>
  :root{
    --n:#E94C1D; --n2:#C63D12; --r:#E30613; --az:#1D7EAA; --az2:#1269B0; --os:#17303F; --mut:#5B6B76;
    --bg:#F3F7FA; --card:#FFFFFF; --bd:#DCE6EC;
    --ok:#17804A; --okbg:#E3F4EA; --no:#B91C26; --nobg:#FCE7E7; --pe:#8A5A00; --pebg:#FFF1D6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--os);-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
  .instalar{margin-top:22px;padding:14px 16px;border-radius:14px;background:#E8F3F8;color:var(--az2);font-size:14px;font-weight:600;line-height:1.4}
  .instalar .btn{margin-top:10px;background:var(--az);color:#fff}
  h1,h2,h3,h4{margin:0}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--os)}
  input:focus,select:focus{outline:none;border-color:var(--n);box-shadow:0 0 0 3px rgba(29,126,170,.22)}
  .btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:13px 16px;width:100%;margin-top:14px;cursor:pointer}
  .btn:focus-visible{outline:3px solid var(--os);outline-offset:2px}
  .primario{background:var(--n);color:#fff}
  .primario:active{background:var(--n2)}
  .secundario{background:#fff;color:var(--n2);border:1.5px solid var(--n)}
  .grande{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;font-size:17px}
  .grande small{font-weight:500;font-size:13px;opacity:.9}
  .mini{width:auto;margin:0;padding:8px 12px;font-size:14px;background:#fff;border:1.5px solid var(--bd);color:var(--os)}
  .mini.ok{border-color:var(--ok);color:var(--ok)}
  .mini.no{border-color:var(--no);color:var(--no)}

  /* Login */
  .login{padding-top:28px}
  .logo{display:block;width:210px;max-width:70%;height:auto}
  .logo-s{display:block;height:34px;width:auto;margin-bottom:10px}
  .login h1{font-size:22px;line-height:1.2;margin:14px 0 22px}
  .login h1 b{display:block;color:var(--n);font-size:40px;letter-spacing:-1px;text-transform:uppercase}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:4px;margin:8px 0 4px}
  .tabs button{flex:1 0 auto;min-width:0;white-space:nowrap;font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;padding:10px 4px;background:transparent;color:var(--mut);cursor:pointer}
  .tabs-sup{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}
  .tabs-sup button{flex:none}
  .tabs button.on{background:var(--az);color:#fff}

  /* Panel */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .top small{color:var(--mut);text-transform:capitalize}
  .top h2{font-size:24px;color:var(--az2)}
  .card{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
  .card h3{font-size:17px}
  .card h4{font-size:15px;margin-top:20px}
  .sub{color:var(--mut);font-size:14px;margin:4px 0 0}
  .destacado{background:linear-gradient(135deg,var(--n),var(--r));color:#fff;border:0}
  .destacado small{opacity:.9}
  .monto{font-size:44px;font-weight:800;letter-spacing:-1px;margin:4px 0}
  .monto span{font-size:18px;font-weight:600;opacity:.9}
  .fila{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
  .tot{margin-top:14px;align-items:center} .tot b{font-size:22px;color:var(--n2)}
  .marcas{margin-top:6px}
  .marca-ok{background:var(--okbg);color:var(--ok);font-weight:700;border-radius:12px;padding:12px 14px;margin-top:10px}
  .kpi-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .big{font-size:36px;font-weight:800;margin:6px 0}
  .big span{font-size:18px;color:var(--mut);font-weight:600}
  .barra{height:10px;background:#E3ECF1;border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--az);border-radius:99px}
  .datos{list-style:none;padding:0;margin:10px 0 0}
  .datos li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #E8EEF2;font-size:15px}
  .datos li:first-child{border-top:0}
  .datos small{color:var(--mut);font-weight:500}
  .chip{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--pebg);color:var(--pe);white-space:nowrap}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.no{background:var(--nobg);color:var(--no)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
  .seg-plat{display:flex;gap:8px;margin-top:12px}
  .seg-plat button{flex:1;font:inherit;font-weight:700;padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;color:var(--mut);cursor:pointer}
  .seg-plat button.on{border-color:var(--az);background:#E8F3F8;color:var(--az2)}
  .input-at{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:12px;background:#fff;padding-left:14px}
  .input-at:focus-within{border-color:var(--n);box-shadow:0 0 0 3px rgba(29,126,170,.22)}
  .input-at span{color:var(--mut);font-weight:700}
  .input-at input{border:0;box-shadow:none;padding-left:6px}
  .lista{list-style:none;padding:0;margin:8px 0 0}
  .lista li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #E8EEF2;font-size:15px}
  .lista li span{font-weight:600;overflow-wrap:anywhere}
  .lista small{color:var(--mut);white-space:nowrap}
  .rojo{color:var(--no)}
  .vacio{color:var(--mut);font-size:14px;margin:8px 0 0}

  /* Supervisor */
  .rank-h{display:flex;align-items:center;gap:10px}
  .rank-h b{flex:1;font-size:16px}
  .pos{width:30px;height:30px;border-radius:50%;background:#E8F3F8;color:var(--az2);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .monto-s{font-weight:800;font-size:18px;color:var(--n2)}
  .selfie{display:flex;gap:12px}
  .foto{width:110px;height:140px;border-radius:12px;background:#E3ECF1;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);padding:6px}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto:has(img){padding:0}
  .selfie-info{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
  .selfie-info small{color:var(--mut)}
  .selfie-info a{color:var(--az2)}
  .acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .filtros{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .filtros label{margin-top:0}
  .resumen{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .seg-item{display:flex;flex-direction:column;gap:8px}
  .seg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .seg-top b{font-size:16px;overflow-wrap:anywhere}
  .seg-top small{display:block;color:var(--mut);font-weight:500;margin-top:2px}
  .seg-acc{display:flex;flex-wrap:wrap;gap:6px}
  a.mini{display:inline-block;text-decoration:none;color:var(--az2);border-color:var(--az)}
  .mas{margin-top:4px}
  .link-nom{font:inherit;font-weight:700;font-size:16px;background:none;border:0;padding:0;color:var(--az2);cursor:pointer;text-align:left}
  .volver{width:auto;margin:0 0 12px;padding:8px 12px;font-size:14px;background:#fff;border:1.5px solid var(--bd);color:var(--os)}
  .perfil{display:flex;gap:14px;align-items:center}
  .avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;background:#E3ECF1;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);text-align:center}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .perfil h3{font-size:20px;color:var(--az2)}
  .dia{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #E8EEF2;font-size:14px}
  .dia:first-of-type{border-top:0}
  .dia small{color:var(--mut)}
  .offline{background:#FFF1D6;color:#8A5A00;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;line-height:1.4}
  .foto img,.avatar img{cursor:zoom-in}
  #visor{position:fixed;inset:0;background:rgba(10,20,28,.92);z-index:40;display:flex;align-items:center;justify-content:center;padding:56px 16px 16px}
  #visor img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
  #visor p{color:#fff;font-weight:600}
  #visor .cerrar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--os);font-size:20px;font-weight:700;cursor:pointer}
  .seg-det{padding:10px 0;border-top:1px solid #E8EEF2}
  .seg-det:first-of-type{border-top:0}
  .v-fila{display:grid;grid-template-columns:1fr 86px 36px;gap:8px;align-items:center;margin-top:12px}
  .v-fila .v-prod{grid-column:1/-1}
  .v-fila input,.v-fila select{padding:11px 10px}
  .quitar{width:36px;height:44px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;color:var(--no);font-size:18px;font-weight:700;cursor:pointer}
  .v-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid #E8EEF2;font-weight:700}
  .v-total b{font-size:22px;color:var(--n2)}
  .v-det{list-style:none;padding:0;margin:6px 0 0;font-size:14px;color:var(--mut)}
  .v-det li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
  .v-montos{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}

  /* Estados */
  .oculto{display:none!important}
  #cargando{position:fixed;inset:0;background:rgba(243,247,250,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
  #cargando p{font-weight:600;margin-top:12px}
  .spinner{width:40px;height:40px;border:4px solid #D6E6EE;border-top-color:var(--az);border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:488px;margin:0 auto;padding:14px 16px;border-radius:12px;font-weight:600;z-index:30;background:var(--os);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .toast.error{background:var(--no)} .toast.ok{background:var(--ok)}
  @media (prefers-reduced-motion: reduce){.spinner{animation-duration:2s}}
</style>
</head>
<body>
<main id="app"></main>
<div id="cargando" class="oculto" role="status" aria-live="polite"><div class="spinner"></div><p id="cargandoTxt">Cargando…</p></div>
<div id="toast" class="oculto" role="alert"></div>
<div id="visor" class="oculto" role="dialog" aria-modal="true" aria-label="Vista ampliada de la foto" onclick="if(event.target===this)cerrarVisor()">
  <button class="cerrar" onclick="cerrarVisor()" aria-label="Cerrar foto">✕</button><div id="visorC"></div>
</div>
<input type="file" id="camara" accept="image/*" capture="user" hidden>

<script>
  const LOGO = 'logo.png';
  const API = 'https://script.google.com/macros/s/AKfycbyubIHvrTvmUnKg1L7jfKs6o4JB-3h0UAM1M_nyDX3cLg-BXB-I2Skej4HqQUsxpP8Z2g/exec';
  const S = { id:null, pin:null, sup:null, plat:'Instagram', tipo:null, tab:'ranking', mes:null, fecha:null, proms:[] };
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  const mem = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fechaBonita(f){ const [y,m,d]=f.split('-').map(Number); return `${DIAS[new Date(y,m-1,d).getDay()]} ${d} de ${MESES[m-1]}`; }
  function fechaCorta(f){ const [y,m,d]=String(f).split('-').map(Number); return `${d} ${MESES[m-1].slice(0,3)}`; }

  async function api(fn, ...a){
    let r, j;
    const red = m => Object.assign(new Error(m), { red: true });
    const ctl = new AbortController(), tmr = setTimeout(() => ctl.abort(), fn === 'marcar' ? 45000 : 25000);
    try { r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: a }), signal: ctl.signal }); }
    catch(e){ throw red('Sin conexión. Revisa tu internet e intenta de nuevo.'); }
    finally { clearTimeout(tmr); }
    try { j = await r.json(); }
    catch(e){ throw red('El servidor no respondió. Intenta de nuevo en un momento.'); }
    if (!j.ok) throw new Error(String(j.error || 'Error desconocido').replace(/^Error:\s*/,''));
    return j.data;
  }

  /* ---------- Instalación como app ---------- */
  let promptInstalar = null;
  const esApp = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; pintarInstalar(); });
  window.addEventListener('appinstalled', () => { promptInstalar = null; pintarInstalar(); });
  function pintarInstalar(){
    const el = document.getElementById('instalar');
    if (!el) return;
    if (esApp()) { el.innerHTML = ''; return; }
    if (promptInstalar) {
      el.innerHTML = '<div class="instalar">Instala la app en tu celular para abrirla más rápido.<button class="btn" onclick="instalarApp()">📲 Instalar app</button></div>';
    } else if (esIOS()) {
      el.innerHTML = '<div class="instalar">📲 Para instalar la app en iPhone: toca el botón <b>Compartir</b> de Safari y luego <b>Agregar a inicio</b>.</div>';
    } else {
      el.innerHTML = '';
    }
  }
  async function instalarApp(){
    if (!promptInstalar) return;
    promptInstalar.prompt();
    try { await promptInstalar.userChoice; } catch(e){}
    promptInstalar = null; pintarInstalar();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  function cargando(on, t){ $('#cargando').classList.toggle('oculto', !on); if(t) $('#cargandoTxt').textContent = t; }
  let toastT;
  function toast(msg, tipo){
    const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + (tipo||'');
    clearTimeout(toastT); toastT = setTimeout(() => t.className = 'oculto', 4000);
  }
  async function run(fn, txt, ...a){
    cargando(true, txt || 'Cargando…');
    try { return await api(fn, ...a); }
    catch(e){ toast(e.message, 'error'); throw e; }
    finally { cargando(false); }
  }

  /* ---------- Inicio y acceso ---------- */
  async function iniciar(){
    const id = mem.get('rp_id'), pin = mem.get('rp_pin'), sp = mem.get('rp_sup');
    if (id && pin){
      S.id = id; S.pin = pin;
      cargando(true, 'Cargando tu panel…');
      try { const d = await api('panelPromotora', id, pin); panel(d); sincronizar(); return; }
      catch(e){
        if (e.red && cacheGet('rp_panel')) { panelOffline(); return; }
        if (!e.red) { mem.del('rp_id'); mem.del('rp_pin'); S.id = S.pin = null; toast(e.message, 'error'); }
      } finally { cargando(false); }
      S.id = S.pin = null;
    }
    try { S.proms = await run('listarPromotoras', 'Abriendo…'); cacheSet('rp_proms', S.proms); }
    catch(e){ S.proms = cacheGet('rp_proms') || []; }
    if (sp){
      try { const d = await run('loginSupervisor', 'Entrando…', sp); abrirSup(sp, d); return; }
      catch(e){ mem.del('rp_sup'); }
    }
    vistaLogin('prom');
  }

  function vistaLogin(modo){
    modo = modo || 'prom';
    app.innerHTML = `
      <div class="login">
        <img class="logo" src="${LOGO}" alt="Deli Snacks Distribuidora">
        <h1>Tus resultados tienen <b>recompensa</b></h1>
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="${modo==='prom'}" class="${modo==='prom'?'on':''}" onclick="vistaLogin('prom')">Promotora</button>
          <button role="tab" aria-selected="${modo==='sup'}" class="${modo==='sup'?'on':''}" onclick="vistaLogin('sup')">Supervisor</button>
        </div>
        ${modo==='prom' ? `
          <label for="selProm">Tu nombre</label>
          <select id="selProm"><option value="">Selecciona tu nombre</option>
            ${S.proms.map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}
          </select>
          <label for="pinProm">PIN</label>
          <input id="pinProm" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
          <button class="btn primario" onclick="entrarProm()">Entrar</button>`
        : `
          <label for="pinSup">PIN de supervisor</label>
          <input id="pinSup" type="password" inputmode="numeric" maxlength="8">
          <button class="btn primario" onclick="entrarSup()">Entrar al panel</button>`}
        <div id="instalar"></div>
      </div>`;
    pintarInstalar();
  }

  async function entrarProm(){
    const id = $('#selProm').value, pin = $('#pinProm').value.trim();
    if (!id) return toast('Selecciona tu nombre', 'error');
    if (!pin) return toast('Escribe tu PIN', 'error');
    try {
      const d = await run('panelPromotora', 'Entrando…', id, pin);
      S.id = id; S.pin = pin; mem.set('rp_id', id); mem.set('rp_pin', pin); panel(d);
    } catch(e){}
  }
  function salir(){
    if (OFF.cola.length && !confirm('Tienes ' + OFF.cola.length + ' registro(s) sin enviar. Si sales se perderán. ¿Salir igual?')) return;
    ['rp_id','rp_pin','rp_sup','rp_panel','rp_listas','rp_cola'].forEach(k => mem.del(k)); OFF.cola = [];
    S.id = S.pin = S.sup = null; V.listas = null; vistaLogin('prom');
  }

  /* ---------- Panel de la promotora ---------- */
  function estadoKpi(v){ return v ? '<span class="chip ok">Cumple</span>' : '<span class="chip no">No cumple aún</span>'; }

  function panel(d){
    if (!d.__off) cacheSet('rp_panel', d);
    const r = d.res;
    const pct = Math.min(100, Math.round(r.seguidores / r.meta * 100));
    const faltan = Math.max(0, r.meta - r.seguidores);
    app.innerHTML = `
      <img class="logo-s" src="${LOGO}" alt="Deli Snacks">
      <div id="offBanner"></div>
      <header class="top">
        <div><small>${esc(d.mesNombre)}</small><h2>Hola, ${esc(d.nombre.split(' ')[0])}</h2></div>
        <button class="btn mini" onclick="salir()">Salir</button>
      </header>

      <section class="card destacado">
        <small>Si el mes cerrara hoy, ganarías</small>
        <div class="monto">$${r.monto.toFixed(2)} <span>de $${d.bono}</span></div>
        <div class="fila"><span>${r.cumplidos} de 4 KPIs cumplidos</span><span>⭐ ${r.puntos} puntos</span></div>
      </section>

      <section class="card">
        <h3>Hoy, ${esc(fechaBonita(d.fecha))}</h3>
        <p class="sub">${d.horario.sinEvento ? 'Hoy no tienes evento asignado.' : `Tu horario: ${esc(d.horario.entrada)} a ${esc(d.horario.salida)}${d.horario.lugar ? ' · ' + esc(d.horario.lugar) : ''}`}</p>
        <div class="marcas">
          ${d.entrada
            ? `<div class="marca-ok">✅ Entrada marcada a las ${esc(d.entrada)}${d.vestHoy ? ` · Uniforme: ${esc(d.vestHoy)}` : ''}</div>`
            : `<button class="btn primario grande" onclick="marcar('Entrada')">📸 Marcar entrada<small>Selfie de cuerpo entero con el uniforme</small></button>`}

        <h4>Registrados este mes (${r.seguidores})</h4>
        ${d.segs.length
          ? `<ul class="lista">${d.segs.map(s => `<li><span>@${esc(s.usuario)}</span><small>${esc(s.plataforma)} · ${esc(fechaCorta(s.fecha))}${s.estado==='Rechazado' ? ' · <b class="rojo">Rechazado</b>' : s.pend ? ' · ⏳ por enviar' : ''}</small></li>`).join('')}</ul>`
          : '<p class="vacio">Todavía no has registrado seguidores este mes. ¡Empieza con el primero!</p>'}
      </section>`;
    pintarBanner(d.__off);
    pintarFormVenta();
  }

  /* ---------- Registro de ventas ---------- */
  const dinero = n => '$' + (Number(n) || 0).toFixed(2);
  const PRES = ['Unidad', 'Manga', 'Bulto'];
  const nuevoItem = () => ({ producto: '', presentacion: 'Unidad', unidades: '' });
  const V = { listas: null, comercio: '', items: [nuevoItem()], monto: '' };
  async function pintarFormVenta(){
    const el = document.getElementById('formVenta');
    if (!el) return;
    if (!V.listas) {
      try { V.listas = await api('listasVenta', S.id, S.pin); cacheSet('rp_listas', V.listas); }
      catch(e){
        V.listas = e.red ? cacheGet('rp_listas') : null;
        if (!V.listas) { el.innerHTML = `<p class="vacio">${esc(e.message)}</p>`; return; }
      }
    }
    const L = V.listas;
    if (!L.productos.length) {
      el.innerHTML = '<p class="vacio">Aún no hay productos cargados. Avísale al supervisor para que los agregue.</p>';
      return;
    }
    el.innerHTML = `
      <label for="vCom">¿En qué comercio estás?</label>
      <input id="vCom" list="vComs" autocomplete="off" maxlength="80" placeholder="Ej. Bodega La Esquina, San Diego"
        value="${esc(V.comercio)}" oninput="V.comercio=this.value">
      <datalist id="vComs">${L.comercios.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <p class="sub">Escribe el nombre del negocio. Si ya se usó antes, elígelo de las sugerencias. Al guardar se registra tu ubicación.</p>
      <label>Productos vendidos</label>
      ${V.items.map((it, i) => `
        <div class="v-fila">
          <select class="v-prod" aria-label="Producto ${i+1}" onchange="V.items[${i}].producto=this.value">
            <option value="">Elige el producto</option>
            ${L.productos.map(p => `<option value="${esc(p.nombre)}" ${it.producto===p.nombre?'selected':''}>${esc(p.nombre)}</option>`).join('')}
          </select>
          <select aria-label="Presentación ${i+1}" onchange="V.items[${i}].presentacion=this.value">
            ${PRES.map(x => `<option ${it.presentacion===x?'selected':''}>${x}</option>`).join('')}
          </select>
          <input aria-label="Cantidad ${i+1}" type="number" inputmode="numeric" min="1" step="1" placeholder="Cant." value="${esc(it.unidades)}"
            oninput="V.items[${i}].unidades=this.value">
          <button class="quitar" aria-label="Quitar producto ${i+1}" onclick="quitarItem(${i})">×</button>
        </div>`).join('')}
      <button class="btn secundario" onclick="V.items.push(nuevoItem());pintarFormVenta()">+ Agregar otro producto</button>
      <label for="vMonto">Monto cobrado ($)</label>
      <input id="vMonto" inputmode="decimal" placeholder="Ej. 25.50" value="${esc(V.monto)}" oninput="V.monto=this.value">
      <button class="btn primario" onclick="guardarVenta()">Guardar ventas</button>`;
  }
  function quitarItem(i){
    V.items.splice(i, 1);
    if (!V.items.length) V.items.push(nuevoItem());
    pintarFormVenta();
  }
  async function guardarVenta(){
    if (String(V.comercio).trim().length < 2) return toast('Escribe el nombre del comercio donde estás', 'error');
    const items = V.items.filter(it => it.producto || it.unidades);
    if (!items.length) return toast('Agrega al menos un producto', 'error');
    for (const it of items) {
      const u = Number(it.unidades);
      if (!it.producto) return toast('Elige el producto en todas las filas', 'error');
      if (!(Number.isInteger(u) && u > 0)) return toast('Revisa la cantidad de ' + it.producto, 'error');
    }
    const m = String(V.monto).trim().replace(',', '.');
    if (m === '' || isNaN(Number(m)) || Number(m) <= 0) return toast('Escribe el monto cobrado', 'error');
    cargando(true, 'Obteniendo ubicación…');
    const pos = await gps();
    const lista = items.map(it => ({ producto: it.producto, presentacion: it.presentacion || 'Unidad', cantidad: Number(it.unidades) }));
    const meta = { comercio: V.comercio.trim(), unidades: lista.reduce((a, x) => a + x.cantidad, 0),
      total: Math.round(Number(m) * 100) / 100 };
    const ok = await enviarOEncolar('registrarVenta', 'Guardando ventas…',
      [S.id, S.pin, meta.comercio, lista, m, pos.lat || '', pos.lng || ''], meta, 'Ventas guardadas ✅');
    if (ok) { V.comercio = ''; V.items = [nuevoItem()]; V.monto = ''; pintarFormVenta(); }
  }

  function plat(p){
    S.plat = p;
    document.querySelectorAll('.seg-plat button').forEach(b => b.classList.toggle('on', b.textContent === p));
  }

  async function agregarSeg(){
    const u = $('#usr').value.trim();
    if (!u) return toast('Escribe el usuario del seguidor', 'error');
    const ok = await enviarOEncolar('registrarSeguidor', 'Guardando seguidor…', [S.id, S.pin, S.plat, u],
      { plataforma: S.plat, usuario: u.replace(/^@/, '').toLowerCase() }, 'Seguidor agregado ✅');
    if (ok) { const i = $('#usr'); if (i) i.focus(); }
  }

  /* ---------- Selfie de entrada / salida ---------- */
  function marcar(tipo){ S.tipo = tipo; const c = $('#camara'); c.value = ''; c.click(); }

  function comprimir(file){
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.72).split(',')[1]);
      };
      img.onerror = rej; img.src = url;
    });
  }
  function gps(){
    return new Promise(res => {
      if (!navigator.geolocation) return res({});
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6) }),
        () => res({}), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    });
  }

  $('#camara').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    let b64, pos;
    cargando(true, 'Preparando la foto…');
    try { b64 = await comprimir(f); cargando(true, 'Obteniendo ubicación…'); pos = await gps(); }
    catch(err){ cargando(false); return toast('No se pudo leer la foto. Intenta de nuevo.', 'error'); }
    await enviarOEncolar('marcar', 'Guardando ' + S.tipo.toLowerCase() + '…',
      [S.id, S.pin, S.tipo, b64, pos.lat || '', pos.lng || ''], { tipo: S.tipo }, S.tipo + ' registrada ✅');
  });

  /* ---------- Modo sin conexión ---------- */
  function cacheGet(k){ try { return JSON.parse(mem.get(k) || 'null'); } catch(e){ return null; } }
  function cacheSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  const OFF = { cola: cacheGet('rp_cola') || [], enviando: false };
  const dosD = n => String(n).padStart(2, '0');
  const ahoraLocal = () => { const t = new Date(); return { fecha: t.getFullYear() + '-' + dosD(t.getMonth() + 1) + '-' + dosD(t.getDate()), hora: dosD(t.getHours()) + ':' + dosD(t.getMinutes()) }; };

  async function enviarOEncolar(fn, txt, args, meta, okMsg){
    cargando(true, txt);
    try { const d = await api(fn, ...args); panel(d); toast(okMsg, 'ok'); return true; }
    catch(e){
      if (!e.red) { toast(e.message, 'error'); return false; }
      const off = ahoraLocal();
      OFF.cola.push({ fn: fn, args: args.concat([off]), off: off, meta: meta });
      if (!cacheSet('rp_cola', OFF.cola)) { OFF.cola.pop(); toast('No hay espacio en el celular para guardar sin conexión.', 'error'); return false; }
      panelOffline();
      toast('Sin conexión: quedó guardado y se enviará solo cuando vuelva la señal.', 'ok');
      return true;
    } finally { cargando(false); }
  }

  // Panel armado con los últimos datos guardados más lo que está pendiente por enviar.
  function panelOffline(){
    const d = cacheGet('rp_panel'); if (!d) return;
    const hoy = ahoraLocal().fecha;
    d.__off = true;
    if (d.fecha !== hoy) { d.fecha = hoy; d.entrada = d.salida = d.vestHoy = null; }
    OFF.cola.forEach(it => {
      if (it.fn === 'marcar' && it.off.fecha === hoy) {
        if (it.meta.tipo === 'Entrada') { d.entrada = it.off.hora + ' (por enviar)'; d.vestHoy = null; } else d.salida = it.off.hora + ' (por enviar)';
      }
      if (it.fn === 'registrarSeguidor') { d.segs.unshift({ usuario: it.meta.usuario, plataforma: it.meta.plataforma, fecha: it.off.fecha, estado: 'Válido', pend: true }); d.res.seguidores++; }
      if (it.fn === 'registrarVenta') d.ventas.unshift({ fecha: it.off.fecha, comercio: it.meta.comercio, unidades: it.meta.unidades, total: it.meta.total, estado: 'Válida', pend: true });
    });
    panel(d);
  }

  function pintarBanner(sinRed){
    const el = document.getElementById('offBanner'); if (!el) return;
    const n = OFF.cola.length;
    el.innerHTML = !n && !sinRed ? '' : `<div class="offline">📶 ${OFF.enviando ? 'Enviando registros guardados…' : sinRed ? 'Sin conexión: estás viendo tus últimos datos guardados.' : 'Hay registros guardados sin enviar.'}
      ${n ? `<br>${n} registro(s) por enviar. Se envían solos cuando vuelve la señal.` : ''}
      ${n && !OFF.enviando ? '<button class="btn mini" style="margin-top:8px" onclick="sincronizar()">Reintentar ahora</button>' : ''}</div>`;
  }

  async function sincronizar(){
    if (OFF.enviando || !OFF.cola.length) return;
    OFF.enviando = true; pintarBanner();
    let ultimo = null, enviados = 0;
    while (OFF.cola.length) {
      const it = OFF.cola[0];
      try { ultimo = await api(it.fn, ...it.args); enviados++; }
      catch(e){
        if (e.red) break;
        toast('Un registro guardado no se pudo cargar: ' + e.message, 'error');
      }
      OFF.cola.shift(); cacheSet('rp_cola', OFF.cola);
    }
    OFF.enviando = false;
    if (S.id && !S.sup) {
      if (ultimo) panel(ultimo); else if (OFF.cola.length) pintarBanner(); else { try { panel(await api('panelPromotora', S.id, S.pin)); } catch(e){ pintarBanner(); } }
    }
    if (enviados && !OFF.cola.length) toast('Registros sin conexión enviados ✅', 'ok');
  }
  window.addEventListener('online', sincronizar);
  setInterval(sincronizar, 30000);

  /* ---------- Panel del supervisor ---------- */
  async function entrarSup(){
    const p = $('#pinSup').value.trim();
    if (!p) return toast('Escribe el PIN', 'error');
    try { const d = await run('loginSupervisor', 'Entrando…', p); abrirSup(p, d); } catch(e){}
  }
  function abrirSup(pin, d){
    S.sup = pin; mem.set('rp_sup', pin);
    S.mes = d.mes; S.fecha = d.fecha; S.proms = d.promotoras;
    supTab('ranking');
  }
  function supTab(t){
    S.tab = t;
    app.innerHTML = `
      <img class="logo-s" src="${LOGO}" alt="Deli Snacks">
      <header class="top"><div><small>Panel</small><h2>Supervisor</h2></div><button class="btn mini" onclick="salir()">Salir</button></header>
      <nav class="tabs tabs-sup" role="tablist">
        ${[['ranking','Ranking'],['vest','Uniforme'],['seg','Seguidores'],['ven','Ventas'],['just','Permisos'],['age','Agenda'],['eq','Equipo']].map(([k,n]) =>
          `<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" onclick="supTab('${k}')">${n}</button>`).join('')}
      </nav>
      <div id="supC" style="margin-top:12px"></div>`;
    if (t === 'ranking') verRanking(); else if (t === 'vest') verVest(); else if (t === 'seg') verSeg(); else if (t === 'ven') verVen(); else if (t === 'eq') verEquipo(); else if (t === 'age') verAgenda(); else verJust();
  }

  async function verRanking(){
    try {
      const d = await run('resumenMes', 'Calculando resultados…', S.sup, S.mes);
      const k = v => v ? 'ok' : 'no';
      $('#supC').innerHTML = `
        <div class="card">
          <label for="mes" style="margin-top:0">Mes</label>
          <input id="mes" type="month" value="${esc(S.mes)}" onchange="if(this.value){S.mes=this.value;verRanking()}">
          <div class="fila tot"><span>Total en bonos de ${esc(d.mesNombre)}</span><b>$${d.total.toFixed(2)}</b></div>
        </div>
        ${d.filas.length ? d.filas.map((f, i) => `
          <div class="card">
            <div class="rank-h"><span class="pos">${i+1}</span><b><button class="link-nom" onclick="verDetalle('${esc(f.id)}')">${esc(f.nombre)} ›</button></b><span class="monto-s">$${f.monto.toFixed(2)}</span></div>

              <span class="chip ${k(f.kpi.horario)}">Horario: ${f.inasistencias} inasist. · ${f.incidencias} incid.</span>
              <span class="chip ${k(f.kpi.vestimenta)}">Uniforme: ${f.faltasVest} faltas${f.pendVest ? ` · ${f.pendVest} por revisar` : ''}</span>
              <span class="chip ${k(f.kpi.ventas)}">Ventas: ${dinero(f.ventas)}${f.metaVentas > 0 ? ' / ' + dinero(f.metaVentas) : ' · sin meta'}</span>
            </div>
            <p class="sub">⭐ ${f.puntos} puntos · ${f.cumplidos} de 4 KPIs</p>
          </div>`).join('') : '<p class="vacio">No hay promotoras activas.</p>'}`;
    } catch(e){}
  }

  async function verVest(){
    try {
      const l = await run('vestimentaDia', 'Cargando selfies…', S.sup, S.fecha);
      const pend = l.filter(x => x.vest === 'Pendiente').length;
      const cls = v => v === 'Aprobada' ? 'ok' : v === 'Falta' ? 'no' : '';
      $('#supC').innerHTML = `
        <div class="card">
          <label for="fec" style="margin-top:0">Fecha</label>
          <input id="fec" type="date" value="${esc(S.fecha)}" onchange="if(this.value){S.fecha=this.value;verVest()}">
          <p class="sub">${l.length} entradas · ${pend} por revisar</p>
          ${pend ? `<button class="btn secundario" onclick="aprobarTodas()">Aprobar las ${pend} pendientes</button>` : ''}
        </div>
        ${l.length ? l.map(x => `
          <div class="card selfie" id="r_${esc(x.reg)}">
            <div class="foto" data-foto="${esc(x.foto)}">Cargando foto…</div>
            <div class="selfie-info">
              <b>${esc(x.nombre)}</b>
              <small>Entrada ${esc(x.hora)} · ${x.lat ? `<a href="https://maps.google.com/?q=${encodeURIComponent(x.lat + ',' + x.lng)}" target="_blank" rel="noopener">Ver ubicación</a>` : 'sin ubicación'}</small>
              <span class="chip ${cls(x.vest)}">${esc(x.vest)}</span>
              ${x.off ? `<span class="chip" title="Registrado sin conexión">📶 ${esc(x.off)}</span>` : ''}
              <div class="acciones">
                <button class="btn mini ok" onclick="vest('${esc(x.reg)}','Aprobada')">Aprobar</button>
                <button class="btn mini no" onclick="vest('${esc(x.reg)}','Falta')">Falta de uniforme</button>
              </div>
            </div>
          </div>`).join('') : '<p class="vacio">No hay entradas registradas en esta fecha.</p>'}`;
      cargarFotos();
    } catch(e){}
  }
  const FOTOS = {};
  async function fotoUrl(id){
    if (!FOTOS[id]) FOTOS[id] = await api('verFoto', S.sup, id);
    return FOTOS[id];
  }
  async function cargarFotos(){
    for (const el of document.querySelectorAll('.foto[data-foto]')){
      const id = el.dataset.foto;
      if (!id){ el.textContent = 'Sin foto'; continue; }
      try {
        const src = await fotoUrl(id);
        if (!document.body.contains(el)) return;
        el.innerHTML = `<img src="${src}" alt="Selfie de entrada. Toca para ampliar">`;
        el.querySelector('img').onclick = () => verFotoGrande(id);
      } catch(e){ el.textContent = 'No se pudo cargar'; }
    }
  }
  async function verFotoGrande(id){
    const v = $('#visor'), c = $('#visorC');
    c.innerHTML = '<p>Cargando foto…</p>';
    v.classList.remove('oculto');
    try {
      const src = await fotoUrl(id);
      if (!v.classList.contains('oculto')) c.innerHTML = `<img src="${src}" alt="Selfie ampliada">`;
    } catch(e){ c.innerHTML = '<p>No se pudo cargar la foto.</p>'; }
  }
  function cerrarVisor(){ $('#visor').classList.add('oculto'); $('#visorC').innerHTML = ''; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarVisor(); });
  async function vest(reg, estado){
    try {
      await run('marcarVestimenta', 'Guardando…', S.sup, reg, estado);
      const c = document.querySelector('#r_' + CSS.escape(reg) + ' .chip');
      if (c){ c.textContent = estado; c.className = 'chip ' + (estado === 'Aprobada' ? 'ok' : 'no'); }
      toast(estado === 'Aprobada' ? 'Uniforme aprobado ✅' : 'Falta registrada', 'ok');
    } catch(e){}
  }
  async function aprobarTodas(){
    try { const n = await run('aprobarPendientes', 'Aprobando…', S.sup, S.fecha); toast(n + ' selfies aprobadas ✅', 'ok'); verVest(); } catch(e){}
  }

  /* ---------- Revisión de seguidores ---------- */
  const SG = { prom: '', estado: 'todos', lista: [], ver: 40 };
  function perfilUrl(x){
    return x.plataforma === 'TikTok' ? 'https://www.tiktok.com/@' + encodeURIComponent(x.usuario)
                                     : 'https://www.instagram.com/' + encodeURIComponent(x.usuario) + '/';
  }
  async function verSeg(){
    $('#supC').innerHTML = `
      <div class="card">
        <div class="filtros">
          <div><label for="sgMes">Mes</label>
            <input id="sgMes" type="month" value="${esc(S.mes)}" onchange="if(this.value){S.mes=this.value;cargarSeg()}"></div>
          <div><label for="sgProm">Promotora</label>
            <select id="sgProm" onchange="SG.prom=this.value;cargarSeg()"><option value="">Todas</option>
              ${S.proms.map(p => `<option value="${esc(p.id)}" ${SG.prom===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}
            </select></div>
        </div>
        <label for="sgEst">Mostrar</label>
        <select id="sgEst" onchange="SG.estado=this.value;SG.ver=40;pintarSeg()">
          ${[['todos','Todos'],['Válido','Sin revisar'],['Verificado','Verificados'],['Rechazado','Rechazados']].map(([v,n]) =>
            `<option value="${v}" ${SG.estado===v?'selected':''}>${n}</option>`).join('')}
        </select>
        <div class="resumen" id="sgRes"></div>
      </div>
      <div id="sgLista"></div>`;
    cargarSeg();
  }
  async function cargarSeg(){
    try {
      SG.lista = await run('seguidoresSup', 'Cargando seguidores…', S.sup, S.mes, SG.prom);
      SG.ver = 40; pintarSeg();
    } catch(e){}
  }
  function pintarSeg(){
    const L = SG.lista;
    const c = e => L.filter(x => x.estado === e).length;
    const res = $('#sgRes');
    if (!res) return;
    res.innerHTML = `<span class="chip">${c('Válido')} sin revisar</span>
      <span class="chip ok">${c('Verificado')} verificados</span>
      <span class="chip no">${c('Rechazado')} rechazados</span>`;
    const f = SG.estado === 'todos' ? L : L.filter(x => x.estado === SG.estado);
    const vis = f.slice(0, SG.ver);
    const etq = { 'Válido': ['', 'Sin revisar'], 'Verificado': ['ok', 'Verificado'], 'Rechazado': ['no', 'Rechazado'] };
    $('#sgLista').innerHTML = f.length ? vis.map(x => `
      <div class="card seg-item" id="sg_${x.fila}">
        <div class="seg-top">
          <div><b>@${esc(x.usuario)}</b><small>${esc(x.plataforma)} · ${esc(x.nombre)} · ${esc(fechaCorta(x.fecha))} ${esc(x.hora)}</small>${x.off ? `<span class="chip" title="Registrado sin conexión">📶 ${esc(x.off)}</span>` : ''}</div>
          <span class="chip ${etq[x.estado][0]}">${etq[x.estado][1]}</span>
        </div>
        <div class="seg-acc">
          <a class="btn mini" href="${perfilUrl(x)}" target="_blank" rel="noopener">Ver perfil ↗</a>
          ${x.estado !== 'Verificado' ? `<button class="btn mini ok" onclick="cambiarSeg(${x.fila},'Verificado')">✓ Verificar</button>` : ''}
          ${x.estado !== 'Rechazado' ? `<button class="btn mini no" onclick="cambiarSeg(${x.fila},'Rechazado')">✕ Rechazar</button>`
                                     : `<button class="btn mini" onclick="cambiarSeg(${x.fila},'Válido')">↺ Restaurar</button>`}
        </div>
      </div>`).join('') + (f.length > SG.ver ? `<button class="btn secundario mas" onclick="SG.ver+=40;pintarSeg()">Ver más (${f.length - SG.ver} restantes)</button>` : '')
      : '<p class="vacio">No hay seguidores con este filtro.</p>';
  }
  async function cambiarSeg(fila, estado){
    const x = SG.lista.find(y => y.fila === fila);
    if (!x) return;
    try {
      await run('estadoSeguidor', 'Guardando…', S.sup, fila, x.usuario, estado);
      x.estado = estado; pintarSeg();
      toast(estado === 'Verificado' ? 'Seguidor verificado ✅' : estado === 'Rechazado' ? 'Seguidor rechazado: ya no cuenta' : 'Seguidor restaurado', 'ok');
    } catch(e){}
  }

  /* ---------- Ventas (supervisor) ---------- */
  const VS = { prom: '', lista: [], ver: 30 };
  function verVen(){
    $('#supC').innerHTML = `
      <div class="card">
        <div class="filtros">
          <div><label for="vsMes">Mes</label>
            <input id="vsMes" type="month" value="${esc(S.mes)}" onchange="if(this.value){S.mes=this.value;cargarVen()}"></div>
          <div><label for="vsProm">Promotora</label>
            <select id="vsProm" onchange="VS.prom=this.value;cargarVen()"><option value="">Todas</option>
              ${S.proms.map(p => `<option value="${esc(p.id)}" ${VS.prom===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}
            </select></div>
        </div>
        <div class="resumen" id="vsRes"></div>
      </div>
      <div id="vsLista"></div>`;
    cargarVen();
  }
  async function cargarVen(){
    try { VS.lista = await run('ventasSup', 'Cargando ventas…', S.sup, S.mes, VS.prom); VS.ver = 30; pintarVen(); } catch(e){}
  }
  function pintarVen(){
    const val = VS.lista.filter(v => v.estado !== 'Anulada');
    const cob = val.reduce((a, v) => a + v.monto, 0);
    const res = $('#vsRes'); if (!res) return;
    res.innerHTML = `<span class="chip ok">${val.length} ventas · ${dinero(cob)} cobrado</span>`;
    const vis = VS.lista.slice(0, VS.ver);
    $('#vsLista').innerHTML = VS.lista.length ? vis.map(v => `
      <div class="card seg-item">
        <div class="seg-top">
          <div><b>${esc(v.comercio)}</b><small>${esc(v.nombre)} · ${esc(fechaCorta(v.fecha))} ${esc(v.hora)}</small>${v.off ? `<span class="chip" title="Registrado sin conexión">📶 ${esc(v.off)}</span>` : ''}</div>
          ${v.estado === 'Anulada' ? '<span class="chip no">Anulada</span>' : '<span class="chip ok">Válida</span>'}
        </div>
        <ul class="v-det">${v.detalle.map(x => `<li><span>${esc(x.producto)}</span><span>${x.unidades} ${esc(x.unidades === 1 ? x.presentacion.toLowerCase() : ({Unidad:'unidades',Manga:'mangas',Bulto:'bultos'})[x.presentacion] || 'unidades')}</span></li>`).join('')}</ul>
        <div class="v-montos"><span>Cobrado: ${dinero(v.monto)}</span></div>
        <div class="seg-acc">
          ${v.lat ? `<a class="btn mini" href="https://maps.google.com/?q=${encodeURIComponent(v.lat + ',' + v.lng)}" target="_blank" rel="noopener">Ver ubicación ↗</a>` : '<span class="chip">Sin ubicación</span>'}
          ${v.estado === 'Anulada' ? `<button class="btn mini" onclick="cambiarVen('${esc(v.idVenta)}','Válida')">↺ Restaurar</button>`
                                   : `<button class="btn mini no" onclick="cambiarVen('${esc(v.idVenta)}','Anulada')">✕ Anular</button>`}
        </div>
      </div>`).join('') + (VS.lista.length > VS.ver ? `<button class="btn secundario mas" onclick="VS.ver+=30;pintarVen()">Ver más (${VS.lista.length - VS.ver} restantes)</button>` : '')
      : '<p class="vacio">No hay ventas registradas con este filtro.</p>';
  }
  async function cambiarVen(id, estado){
    try {
      await run('estadoVenta', 'Guardando…', S.sup, id, estado);
      const v = VS.lista.find(x => x.idVenta === id); if (v) v.estado = estado;
      pintarVen(); toast(estado === 'Anulada' ? 'Venta anulada: ya no cuenta' : 'Venta restaurada', 'ok');
    } catch(e){}
  }

  /* ---------- Resumen de una promotora ---------- */
  async function verDetalle(id){
    let d;
    cargando(true, 'Cargando resumen…');
    try { [d, DS.lista] = await Promise.all([api('detallePromotora', S.sup, id, S.mes), api('seguidoresSup', S.sup, S.mes, id)]); }
    catch(e){ toast(e.message, 'error'); return; }
    finally { cargando(false); }
    const r = d.res, k = v => v ? 'ok' : 'no';
    const vcls = v => v === 'Aprobada' ? 'ok' : v === 'Falta' ? 'no' : '';
    const segN = e => d.seguidores.filter(x => x.estado === e).length;
    const vVal = d.ventas.filter(v => v.estado !== 'Anulada');
    $('#supC').innerHTML = `
      <button class="btn volver" onclick="verRanking()">‹ Volver al ranking</button>
      <div class="card">
        <div class="perfil">
          <div class="avatar ${d.fotoId ? 'foto' : ''}" ${d.fotoId ? `data-foto="${esc(d.fotoId)}"` : ''}>${d.fotoId ? 'Cargando…' : 'Sin foto'}</div>
          <div>
            <h3>${esc(d.nombre)}</h3>
            <p class="sub">${d.ingreso ? 'Ingresó el ' + esc(fechaCorta(d.ingreso)) : 'Fecha de ingreso sin cargar'}${d.activa ? '' : ' · Inactiva'}</p>
            ${r ? `<p class="sub"><b class="monto-s">${dinero(r.monto)}</b> · ⭐ ${r.puntos} puntos · ${r.cumplidos} de 4 KPIs</p>` : ''}
          </div>
        </div>
        ${r ? `<div class="chips">
          <span class="chip ${k(r.kpi.seguidores)}">Seguidores ${r.seguidores}/${r.meta}</span>
          <span class="chip ${k(r.kpi.horario)}">Horario: ${r.inasistencias} inasist. · ${r.incidencias} incid.</span>
          <span class="chip ${k(r.kpi.vestimenta)}">Uniforme: ${r.faltasVest} faltas${r.pendVest ? ` · ${r.pendVest} por revisar` : ''}</span>
          <span class="chip ${k(r.kpi.ventas)}">Ventas: ${dinero(r.ventas)}${r.metaVentas > 0 ? ' / ' + dinero(r.metaVentas) : ''}</span>
        </div>` : ''}
      </div>

      <div class="card">
        <h3>Asistencia del mes (${d.dias.length} días)</h3>
        ${d.dias.length ? d.dias.map(x => `
          <div class="dia">
            <span><b>${esc(fechaCorta(x.fecha))}</b><br><small>Entrada ${esc(x.entrada || '—')} · Salida ${esc(x.salida || '—')}</small>${x.off ? '<br><small>📶 ' + esc(x.off) + '</small>' : ''}</span>
            <span>${x.entrada ? `<span class="chip ${vcls(x.vest)}">${esc(x.vest)}</span>` : '<span class="chip no">Sin entrada</span>'}
            ${x.foto ? ` <button class="btn mini" onclick="verFotoGrande('${esc(x.foto)}')">Foto</button>` : ''}
            ${x.lat ? ` <a class="btn mini" href="https://maps.google.com/?q=${encodeURIComponent(x.lat + ',' + x.lng)}" target="_blank" rel="noopener">Mapa</a>` : ''}</span>
          </div>`).join('') : '<p class="vacio">No ha marcado entradas este mes.</p>'}
      </div>

      <div class="card">
        <h3>Permisos (${d.permisos.length})</h3>
        ${d.permisos.length ? `<ul class="lista">${d.permisos.map(x => `<li><span>${esc(x.motivo)}</span><small>${esc(fechaCorta(x.fecha))}</small></li>`).join('')}</ul>` : '<p class="vacio">Sin permisos este mes.</p>'}
      </div>

      <div class="card">
        <h3>Seguidores (${DS.lista.length})</h3>
        <div id="detSeg"></div>
      </div>

      <div class="card">
        <h3>Ventas (${vVal.length} · ${dinero(vVal.reduce((a, v) => a + v.total, 0))})</h3>
        ${d.ventas.length ? `<ul class="lista">${d.ventas.map(v => `<li><span>${esc(v.comercio)}<br><small>${esc(fechaCorta(v.fecha))}${v.estado === 'Anulada' ? ' · <b class="rojo">Anulada</b>' : ''}</small></span><b>${dinero(v.total)}</b></li>`).join('')}</ul>` : '<p class="vacio">Sin ventas este mes.</p>'}
      </div>`;
    DS.ver = 30; pintarSegDet();
    window.scrollTo(0, 0);
    cargarFotos();
  }
  const DS = { lista: [], ver: 30 };
  function pintarSegDet(){
    const el = document.getElementById('detSeg'); if (!el) return;
    const L = DS.lista, n = e => L.filter(x => x.estado === e).length;
    const etq = { 'Válido': ['', 'Sin revisar'], 'Verificado': ['ok', 'Verificado'], 'Rechazado': ['no', 'Rechazado'] };
    el.innerHTML = `<div class="resumen"><span class="chip">${n('Válido')} sin revisar</span><span class="chip ok">${n('Verificado')} verificados</span><span class="chip no">${n('Rechazado')} rechazados</span></div>` +
      (L.length ? L.slice(0, DS.ver).map(x => `
        <div class="seg-det">
          <div class="seg-top"><div><b>@${esc(x.usuario)}</b><small>${esc(x.plataforma)} · ${esc(fechaCorta(x.fecha))} ${esc(x.hora)}${x.off ? ' · 📶 ' + esc(x.off) : ''}</small></div>
            <span class="chip ${etq[x.estado][0]}">${etq[x.estado][1]}</span></div>
          <div class="seg-acc" style="margin-top:8px">
            <a class="btn mini" href="${perfilUrl(x)}" target="_blank" rel="noopener">Ver perfil ↗</a>
            ${x.estado !== 'Verificado' ? `<button class="btn mini ok" onclick="cambiarSegDet(${x.fila},'Verificado')">✓ Verificar</button>` : ''}
            ${x.estado !== 'Rechazado' ? `<button class="btn mini no" onclick="cambiarSegDet(${x.fila},'Rechazado')">✕ Rechazar</button>`
                                       : `<button class="btn mini" onclick="cambiarSegDet(${x.fila},'Válido')">↺ Restaurar</button>`}
          </div>
        </div>`).join('') + (L.length > DS.ver ? `<button class="btn secundario mas" onclick="DS.ver+=30;pintarSegDet()">Ver más (${L.length - DS.ver} restantes)</button>` : '')
      : '<p class="vacio">Sin seguidores este mes.</p>');
  }
  async function cambiarSegDet(fila, estado){
    const x = DS.lista.find(y => y.fila === fila); if (!x) return;
    try {
      await run('estadoSeguidor', 'Guardando…', S.sup, fila, x.usuario, estado);
      x.estado = estado; pintarSegDet();
      toast(estado === 'Verificado' ? 'Seguidor verificado ✅' : estado === 'Rechazado' ? 'Seguidor rechazado: ya no cuenta' : 'Seguidor restaurado', 'ok');
    } catch(e){}
  }

  /* ---------- Equipo: alta y edición de promotoras ---------- */
  const EQ = { lista: [], edit: null };
  async function verEquipo(){
    try { EQ.lista = await run('equipo', 'Cargando equipo…', S.sup); } catch(e){ return; }
    EQ.edit = null; pintarEquipo();
  }
  const pinNuevo = () => String(Math.floor(1000 + Math.random() * 9000));
  function pintarEquipo(){
    const E = EQ.edit;
    const form = E ? `
      <div class="card">
        <h3>${E.id ? 'Editar promotora' : 'Nueva promotora'}</h3>
        <label for="eqNom">Nombre y apellido</label>
        <input id="eqNom" maxlength="60" value="${esc(E.nombre)}" oninput="EQ.edit.nombre=this.value">
        <label for="eqPin">PIN (4 a 6 números)</label>
        <div class="filtros">
          <input id="eqPin" inputmode="numeric" maxlength="6" value="${esc(E.pin)}" oninput="EQ.edit.pin=this.value">
          <button class="btn secundario" style="margin:0" onclick="EQ.edit.pin=pinNuevo();pintarEquipo()">Generar PIN</button>
        </div>
        <label for="eqIng">Fecha de ingreso</label>
        <input id="eqIng" type="date" value="${esc(E.ingreso)}" onchange="EQ.edit.ingreso=this.value">
        ${E.id ? `<label><input type="checkbox" style="width:auto;margin-right:8px" ${E.activa ? 'checked' : ''} onchange="EQ.edit.activa=this.checked">Activa (si la desmarcas, deja de aparecer en la app; su historial se guarda)</label>` : ''}
        <button class="btn primario" onclick="guardarEq()">Guardar</button>
        <button class="btn secundario" onclick="EQ.edit=null;pintarEquipo()">Cancelar</button>
      </div>` : `<button class="btn primario" style="margin:0 0 12px" onclick="EQ.edit={nombre:'',pin:pinNuevo(),ingreso:S.fecha,activa:true};pintarEquipo()">+ Agregar promotora</button>`;
    $('#supC').innerHTML = form + EQ.lista.map(p => `
      <div class="card seg-item">
        <div class="seg-top">
          <div><b>${esc(p.nombre)}</b><small>PIN ${esc(p.pin)} · ${p.ingreso ? 'Ingresó el ' + esc(fechaCorta(p.ingreso)) : 'Sin fecha de ingreso'}</small></div>
          <span class="chip ${p.activa ? 'ok' : 'no'}">${p.activa ? 'Activa' : 'Inactiva'}</span>
        </div>
        <div class="seg-acc"><button class="btn mini" onclick="editarEq('${esc(p.id)}')">Editar</button></div>
      </div>`).join('');
    window.scrollTo(0, 0);
  }
  function editarEq(id){
    const p = EQ.lista.find(x => x.id === id); if (!p) return;
    EQ.edit = { id: p.id, nombre: p.nombre, pin: p.pin, ingreso: p.ingreso, activa: p.activa };
    pintarEquipo();
  }
  async function guardarEq(){
    const E = EQ.edit;
    if (String(E.nombre).trim().length < 2) return toast('Escribe el nombre de la promotora', 'error');
    if (!/^\d{4,6}$/.test(String(E.pin).trim())) return toast('El PIN debe tener de 4 a 6 números', 'error');
    try {
      EQ.lista = await run('guardarPromotora', 'Guardando…', S.sup, E);
      S.proms = EQ.lista.filter(p => p.activa).map(p => ({ id: p.id, nombre: p.nombre }));
      toast(E.id ? 'Cambios guardados ✅' : 'Promotora agregada ✅', 'ok');
      EQ.edit = null; pintarEquipo();
    } catch(e){}
  }

  /* ---------- Agenda: horario de cada evento ---------- */
  const AG = { fecha: null, lista: [], form: { idProm: '', entrada: '08:00', salida: '13:00', lugar: '' } };
  async function verAgenda(){
    AG.fecha = AG.fecha || S.fecha;
    try { AG.lista = await run('agendaDia', 'Cargando agenda…', S.sup, AG.fecha); } catch(e){ return; }
    pintarAgenda();
  }
  function pintarAgenda(){
    const F = AG.form;
    $('#supC').innerHTML = `
      <div class="card">
        <label for="agFecha" style="margin-top:0">Fecha</label>
        <input id="agFecha" type="date" value="${esc(AG.fecha)}" onchange="if(this.value){AG.fecha=this.value;verAgenda()}">
        <p class="sub">La puntualidad se mide con el horario de cada evento. Si cargas eventos en un mes, solo los días con evento cuentan como día de trabajo.</p>
      </div>
      <div class="card">
        <h3>Asignar evento</h3>
        <label for="agProm">Promotora</label>
        <select id="agProm" onchange="AG.form.idProm=this.value"><option value="">Selecciona</option>
          ${S.proms.map(p => `<option value="${esc(p.id)}" ${F.idProm===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
        <div class="filtros" style="margin-top:14px">
          <div><label for="agEnt">Entrada</label><input id="agEnt" type="time" value="${esc(F.entrada)}" onchange="AG.form.entrada=this.value"></div>
          <div><label for="agSal">Salida</label><input id="agSal" type="time" value="${esc(F.salida)}" onchange="AG.form.salida=this.value"></div>
        </div>
        <label for="agLug">Lugar o evento (opcional)</label>
        <input id="agLug" maxlength="80" value="${esc(F.lugar)}" placeholder="Ej. Degustación Supermercado El Prado" oninput="AG.form.lugar=this.value">
        <button class="btn primario" onclick="guardarEv()">Guardar evento</button>
      </div>
      <h4 style="margin:4px 0 10px">Eventos del ${esc(fechaCorta(AG.fecha))} (${AG.lista.length})</h4>
      ${AG.lista.length ? AG.lista.map(ev => `
        <div class="card seg-item">
          <div class="seg-top"><div><b>${esc(ev.nombre)}</b><small>${esc(ev.entrada)} a ${esc(ev.salida)}${ev.lugar ? ' · ' + esc(ev.lugar) : ''}</small></div></div>
          <div class="seg-acc"><button class="btn mini no" onclick="borrarEv('${esc(ev.idEv)}')">Quitar</button></div>
        </div>`).join('') : '<p class="vacio">No hay eventos asignados en esta fecha.</p>'}`;
  }
  async function guardarEv(){
    const F = AG.form;
    if (!F.idProm) return toast('Elige la promotora', 'error');
    if (!F.entrada || !F.salida) return toast('Escribe la hora de entrada y de salida', 'error');
    if (F.salida <= F.entrada) return toast('La salida debe ser después de la entrada', 'error');
    try {
      AG.lista = await run('guardarEvento', 'Guardando…', S.sup, Object.assign({ fecha: AG.fecha }, F));
      F.idProm = ''; pintarAgenda(); toast('Evento guardado ✅', 'ok');
    } catch(e){}
  }
  async function borrarEv(id){
    try { AG.lista = await run('eliminarEvento', 'Quitando…', S.sup, id, AG.fecha); pintarAgenda(); toast('Evento quitado', 'ok'); } catch(e){}
  }

  function verJust(){
    $('#supC').innerHTML = `
      <div class="card">
        <h3>Justificar un día</h3>
        <p class="sub">Un día justificado (permiso, reposo, cambio de ruta) no cuenta como inasistencia ni como incidencia de horario.</p>
        <label for="jp">Promotora</label>
        <select id="jp"><option value="">Selecciona</option>${S.proms.map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}</select>
        <label for="jf">Fecha</label>
        <input id="jf" type="date" value="${esc(S.fecha)}">
        <label for="jm">Motivo</label>
        <input id="jm" maxlength="120">
        <button class="btn primario" onclick="guardarJust()">Guardar justificación</button>
      </div>`;
  }
  async function guardarJust(){
    const id = $('#jp').value, f = $('#jf').value, m = $('#jm').value.trim();
    if (!id || !f || !m) return toast('Completa promotora, fecha y motivo', 'error');
    try { await run('justificar', 'Guardando…', S.sup, id, f, m); toast('Día justificado ✅', 'ok'); $('#jm').value = ''; } catch(e){}
  }

  iniciar();
</script>
</body>
</html>
